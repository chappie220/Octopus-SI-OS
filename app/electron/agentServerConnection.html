<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect to Agent Server</title>
    <style>
      :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
      body { margin: 0; padding: 24px; }
      form { display: grid; gap: 12px; }
      input, button { font: inherit; padding: 9px 12px; border: 1px solid GrayText; border-radius: 8px; }
      button { justify-self: end; }
      #connection-error { margin: 0; min-height: 2.5em; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <form>
      <label for="server-address">Agent server address</label>
      <input id="server-address" type="url" placeholder="http://127.0.0.1:4180" required autofocus>
      <button type="submit">Connect</button>
      <p id="connection-error" role="alert"></p>
    </form>
  </body>
</html>
