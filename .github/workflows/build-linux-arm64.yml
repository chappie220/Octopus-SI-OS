name: build-linux-arm64

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libsqlite3-dev libasound2-dev

      - name: Install client dependencies
        run: npm ci --prefix app

      - name: Build CLI distribution (linux/arm64)
        run: npm --prefix app run build:cli -- --target=aarch64-unknown-linux-gnu

      - name: Build web client
        run: npm --prefix app run build

      - name: Verify build outputs
        run: |
          test -d app/build/cli
          test -d app/build
          ls -la app/build/cli
          cat app/build/cli/runtime-build-receipt.json 2>/dev/null || true

      - name: Upload Linux ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-arm64
          path: app/build
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
