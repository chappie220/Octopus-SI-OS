<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101010" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Octopus</title>
    <style>
      /* Establish the cascade before dependency CSS, including lazy surfaces. */
      @layer octopus-foundation, properties, theme, base, components, utilities;

      :root {
        --startup-background: transparent;
        --startup-logo-shimmer-peak: rgb(255 255 255 / 48%);
        --startup-logo-shimmer-soft: rgb(255 255 255 / 4%);
        --startup-logo-shimmer-tail: rgb(255 255 255 / 8%);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: var(--octopus-viewport-height, 100dvh);
        overflow: hidden;
      }

      html,
      body {
        margin: 0;
        background: var(--startup-background);
      }

      .startup-loader {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--startup-background);
        -webkit-app-region: drag;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .startup-loader__status {
        margin: 0;
        max-width: 340px;
        padding: 0 24px;
        color: rgb(255 255 255 / 68%);
        font-size: 13px;
        line-height: 1.45;
        text-align: center;
      }

      :root.electron-light .startup-loader__status {
        color: rgb(0 0 0 / 64%);
      }

      .startup-loader__retry {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: rgb(255 255 255 / 14%);
        color: rgb(255 255 255 / 92%);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        -webkit-app-region: no-drag;
      }

      .startup-loader__retry:hover {
        background: rgb(255 255 255 / 22%);
      }

      .startup-loader__logo {
        position: relative;
        width: 56px;
        height: 56px;
        opacity: 0;
        animation: startup-octopus-fade-in 180ms ease-out 60ms forwards;
      }

      .startup-loader__base,
      .startup-loader__overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .startup-loader__base {
        object-fit: contain;
        opacity: 0.68;
      }

      .startup-loader__overlay {
        -webkit-mask-image: url("./octopus-logo.png");
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-image: url("./octopus-logo.png");
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;
      }

      :root.electron-light .startup-loader__base {
        filter: brightness(0);
        opacity: 0.24;
      }

      .startup-loader__overlay {
        background-image: linear-gradient(
          112deg,
          transparent 22%,
          var(--startup-logo-shimmer-soft) 38%,
          var(--startup-logo-shimmer-peak) 49%,
          var(--startup-logo-shimmer-tail) 56%,
          transparent 74%
        );
        background-position: 140% 0;
        background-repeat: no-repeat;
        background-size: 220% 100%;
        animation: startup-octopus-shimmer 2200ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loader__logo {
          animation: none;
          opacity: 1;
        }

        .startup-loader__overlay {
          animation: none;
        }
      }

      @keyframes startup-octopus-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes startup-octopus-shimmer {
        from { background-position: 140% 0; }
        to { background-position: -105% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-loader">
        <div aria-hidden="true" class="startup-loader__logo">
          <img alt="" class="startup-loader__base" src="./octopus-logo.png" />
          <div class="startup-loader__overlay"></div>
        </div>
        <p id="startup-loader-status" class="startup-loader__status" role="status" hidden></p>
        <button id="startup-loader-retry" class="startup-loader__retry" type="button" hidden>Retry now</button>
      </div>
    </div>
    <script type="module" src="/src/boot.tsx"></script>
    <script defer src="./boot-watchdog.js"></script>
  </body>
</html>
