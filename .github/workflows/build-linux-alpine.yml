name: build-linux-alpine

on:
  push:
    paths:
      - ".github/workflows/build-linux-alpine.yml"
      - "app/scripts/cli-target.cjs"
      - "app/scripts/test-cli-target.cjs"
      - "crates/octopus-file-storage/src/publication/directory.rs"
      - "crates/octopus-verifiers/src/process_authority/linux.rs"
      - "registry/worker_environment_kind/process_session/packages/octopus-linux-process-authority/**"
      - "registry/worker_environment_kind/process_session/packages/octopus-util-pty/**"
      - "registry/interface/world_provider_codex/packages/octopus-shell-command/**"
      - "registry/worker_environment_kind/filesystem_workspace/packages/octopus-applypatch/**"
      - "registry/worker_environment_kind/filesystem_workspace/packages/octopus-system-workspace-env/**"
  workflow_dispatch:
    inputs:
      arch:
        description: Alpine Linux target architecture
        type: choice
        default: aarch64
        options:
          - aarch64
          - x86_64

permissions:
  contents: read

jobs:
  alpine-musl:
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 300
    env:
      TARGET_TRIPLE: ${{ inputs.arch == 'x86_64' && 'x86_64-unknown-linux-musl' || 'aarch64-unknown-linux-musl' }}
      ARCH_NAME: ${{ inputs.arch || 'aarch64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify inside Alpine Linux (musl) container
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            -e TARGET_TRIPLE="$TARGET_TRIPLE" \
            node:24-alpine \
            sh -euxc '
              apk add --no-cache \
                bash \
                binutils \
                build-base \
                ca-certificates \
                curl \
                fish \
                git \
                libgcc \
                libstdc++ \
                openrc \
                openssl-dev \
                pkgconf \
                python3 \
                sqlite-dev \
                alsa-lib-dev

              git config --global --add safe.directory /work

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --default-host "$TARGET_TRIPLE"
              export PATH="$HOME/.cargo/bin:$PATH"
              rustc --version
              cargo --version
              node --version

              fish -c "printf \"fish-c-ok\n\"" | grep -qx "fish-c-ok"
              fish -lc "printf \"fish-lc-ok\n\"" | grep -qx "fish-lc-ok"
              sh -n registry/worker_environment_kind/process_session/packages/octopus-linux-process-authority/install-linux.sh
              sh -n registry/worker_environment_kind/process_session/packages/octopus-linux-process-authority/octopus-process-authority.openrc

              node -e "const { detectLinuxLibc, hostTarget } = require(\"./app/scripts/cli-target.cjs\"); const libc = detectLinuxLibc(); const triple = hostTarget(); console.log({ libc, triple }); if (libc !== \"musl\" || triple !== process.env.TARGET_TRIPLE) process.exit(1);"

              npm ci --prefix app
              node --test app/scripts/test-cli-target.cjs app/scripts/test-indexed-ledger-projection.cjs

              cargo test --locked \
                -p octopus-linux-process-authority \
                -p octopus-shell-command \
                -p octopus-system-workspace-env \
                -p octopus-applypatch

              npm --prefix app run build:cli -- --target="$TARGET_TRIPLE"
              npm --prefix app run build

              runtime=app/build/cli/runtime
              provider="$runtime/local-packages/registry/interface/world_provider_codex/packages/octopus-provider-codex"
              life="$provider/life-bin/octopus-provider-opencodex-life"
              test -f app/dist/index.html
              test -x "$runtime/bin/octopus"
              test -x "$runtime/bin/octopus-linux-process-authority"
              test -x "$life"
              readelf -l "$runtime/bin/octopus" | grep -q "ld-musl-"
              readelf -l "$runtime/bin/octopus-linux-process-authority" | grep -q "ld-musl-"
              cat "$runtime/runtime-build-receipt.json"
            '

      - name: Summarize musl build outputs
        shell: bash
        run: |
          runtime=app/build/cli/runtime
          life="$runtime/local-packages/registry/interface/world_provider_codex/packages/octopus-provider-codex/life-bin/octopus-provider-opencodex-life"
          {
            echo "### Alpine Linux musl runtime ($TARGET_TRIPLE)"
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo '```text'
            sha256sum "$runtime/bin/octopus" "$runtime/bin/octopus-linux-process-authority" "$life"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Alpine Linux build
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-alpine-${{ env.ARCH_NAME }}
          path: app/build
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
